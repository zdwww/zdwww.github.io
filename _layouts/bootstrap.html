---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} &ndash; {{ site.title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <style>
    .theme-img-dark { display: none; }
    [data-bs-theme="dark"] .theme-img-light { display: none; }
    [data-bs-theme="dark"] .theme-img-dark { display: block; }
  </style>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('personal-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'light');
      }
    })();
  </script>
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-sm bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ '/' | relative_url }}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ '/#publications' | relative_url }}">Publications</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ '/cv/' | relative_url }}">CV</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="{{ '/personal/' | relative_url }}">Personal</a></li>
          <li class="nav-item d-flex align-items-center ms-sm-2 mt-2 mt-sm-0">
            <button id="themeToggle" type="button" class="btn btn-outline-secondary btn-sm" aria-pressed="false" aria-label="Toggle color theme">Dark mode</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5 flex-grow-1">
    {{ content }}
  </main>

  <footer class="py-4 border-top text-center text-body-secondary small">
    <div class="container">
      &copy; {{ site.time | date: '%Y' }} {{ site.author.name }}
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script>
    (function () {
      const STORAGE_KEY = 'personal-theme';
      const root = document.documentElement;
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const btn = document.getElementById('themeToggle');
      if (!btn) return;

      function updateButton(theme) {
        const isDark = theme === 'dark';
        btn.setAttribute('aria-pressed', isDark ? 'true' : 'false');
        btn.textContent = isDark ? 'Light mode' : 'Dark mode';
      }

      function setTheme(theme, persist) {
        root.setAttribute('data-bs-theme', theme);
        updateButton(theme);
        if (persist) {
          try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
        }
      }

      updateButton(root.getAttribute('data-bs-theme') || 'light');

      btn.addEventListener('click', function () {
        const next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        setTheme(next, true);
      });

      mq.addEventListener('change', function (e) {
        try {
          if (!localStorage.getItem(STORAGE_KEY)) {
            setTheme(e.matches ? 'dark' : 'light', false);
          }
        } catch (err) {}
      });
    })();
  </script>
</body>
</html>
